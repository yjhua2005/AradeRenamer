; AradeRenamer English language pack -- THIS is the template for new language packs
; (English is the source language translators work from).
; Format: key=value   ; or # starts a comment   \n \t \r \0 escapes
; %d / %s are placeholders filled in at runtime (each language may reorder them).
; New pack: copy this file, set lang.name / lang.code / lang.author, then translate.
; lang_zh-CN.ini has the complete key list (it is generated) -- check it for missing keys.
