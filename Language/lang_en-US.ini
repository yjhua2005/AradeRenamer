IDS_ABOUT_TEXT = Version 1.0.0-beta.1 (Built on 2026-10-26)   \nHand-written on the raw Win32 API, no third-party libraries.\nRenaming: whole name, replace (incl. regex), numbering,\n      add, delete, extension, meta variables,\n      simplified<->traditional, BIG5<->GB, Shift-JIS,\n      rename to CRC32 / page title / first text line / text commands, change dates.\nTags: read & write MP3/FLAC/APE/OGG/M4A/AAC/\n      WAV/Opus (ID3v1/v2, Vorbis comment).\nAlso: operation log (.xto), list export, drag & drop.
